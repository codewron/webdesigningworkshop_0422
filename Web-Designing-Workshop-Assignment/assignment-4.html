
<!DOCTYPE html>
<html>
<head>
    <title>Semantic and Non-Semantic Elements</title>
</head>
<body>

    <h1>Semantic and Non-Semantic Elements</h1>

    <!-- Semantic Elements -->
    <header>
        <h2>My Website</h2>
        <p>Welcome to my webpage</p>
    </header>

    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Contact</a>
    </nav>

    <main>
        <section>
            <h2>About HTML</h2>
            <p>HTML is used to create webpages.</p>
        </section>

        <article>
            <h2>Learning HTML</h2>
            <p>HTML is easy to learn and understand.</p>
        </article>
    </main>

    <footer>
        <p>Copyright &copy; 2026 My Website</p>
    </footer>

    <!-- Non-Semantic Elements -->
    <div>
        <h2>Non-Semantic Elements</h2>
        <p>This is a div element.</p>
    </div>

    <span>This is a span element.</span>

</body>
</html>
