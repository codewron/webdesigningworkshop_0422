
<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks and Images</title>
</head>
<body>

    <h1>Hyperlinks and Images in HTML</h1>

    <!-- Hyperlinks -->
    <h2>Hyperlinks</h2>

    <p>
        Visit Google:
        <a href="https://www.google.com" target="_blank">
            Click Here
        </a>
    </p>

    <p>
        Visit YouTube:
        <a href="https://www.youtube.com" target="_blank">
            YouTube
        </a>
    </p>

    <!-- Image with Attributes -->
    <h2>Images</h2>

    <img src="image.jpg"
         alt="Sample Image"
         width="300"
         height="200"
         title="My Sample Image">

    <p>This image uses src, alt, width, height and title attributes.</p>

</body>
</html>
