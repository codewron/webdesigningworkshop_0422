
<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

    <h1>Student Details Table</h1>

    <table border="1" cellpadding="10" cellspacing="0">

        <!-- Table Caption -->
        <caption>Student Information</caption>

        <!-- Table Header -->
        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>
            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>B.Tech</td>
                <td>85</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Aman</td>
                <td>B.Tech</td>
                <td>90</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Priya</td>
                <td>B.Tech</td>
                <td>88</td>
            </tr>
        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td colspan="3">Total Students</td>
                <td>3</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
