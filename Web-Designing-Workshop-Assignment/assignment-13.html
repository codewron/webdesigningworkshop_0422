
<!DOCTYPE html>
<html>
<head>
    <title>College Timetable</title>
</head>
<body>

            <th>10-11 AM</th>
            <th>11-12 PM</th>
            <th>12-1 PM</th>

        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>CSS</td>
            <td rowspan="2">Maths</td>
            <td rowspan="5">Lunch</td>

        <tr>
            <td>Tuesday</td>
            <td>Java</td>
            <td>Python</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td colspan="2">Web Designing Lab</td>
            <td>Physics</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>Maths</td>
            <td>HTML</td>
            <td>CSS</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Python</td>
            <td colspan="2">Programming Lab</td>
        </tr>

    </table>

</body>
</html>
