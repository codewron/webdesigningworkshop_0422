
<!DOCTYPE html>
<html>
<head>
    <title>HTML Accessibility</title>
</head>
<body>

    <h1>Accessible Webpage</h1>

    <!-- Image with Alt Text -->
    <h2>Accessible Image</h2>
    <img src="image.jpg"
         alt="A beautiful nature scene"
         width="300" height="200">

    <!-- Accessible Form -->
    <h2>Contact Form</h2>

    <form>
        <label for="name">Enter Your Name:</label>
        <input type="text" id="name"
               name="name" required>

        <br><br>

        <label for="email">Enter Your Email:</label>
        <input type="email" id="email"
               name="email" required>

        <br><br>

        <button type="submit" aria-label="Submit contact form">
            Submit
        </button>
    </form>

    <!-- Semantic Elements -->
    <main>
        <section>
            <h2>About Accessibility</h2>
            <p>Accessibility makes websites easier
               for everyone to use.</p>
        </section>
    </main>

</body>
</html>
