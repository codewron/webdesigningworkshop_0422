
<!DOCTYPE html>
<html>
<head>
    <title>Nested and Mixed Lists</title>
</head>
<body>

    <h1>Nested and Mixed Lists</h1>

    <!-- Nested List -->
    <h2>Nested List</h2>

    <ul>
        <li>Programming Languages
            <ul>
                <li>Python</li>
                <li>Java</li>
                <li>C++</li>
            </ul>
        </li>

        <li>Web Technologies
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </li>
    </ul>

    <!-- Mixed List -->
    <h2>Mixed List</h2>

    <ol>
        <li>Frontend
            <ul>
                <li>HTML</li>
                <li>CSS</li>
            </ul>
        </li>

        <li>Backend
            <ol>
                <li>Python</li>
                <li>PHP</li>
            </ol>
        </li>

        <li>Database
            <ul>
                <li>MySQL</li>
                <li>MongoDB</li>
            </ul>
        </li>
    </ol>

</body>
</html>
