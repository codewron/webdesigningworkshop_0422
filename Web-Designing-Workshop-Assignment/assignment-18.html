
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Page</title>
</head>

<body>

    <header>
        <h1>Student Admission Form</h1>
        <p>Welcome! Fill in the details to apply for admission.</p>
    </header>

    <main>

        <form action="#" method="post">

            <fieldset>
                <legend>Personal Details</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       pattern="[0-9]{10}" required>
                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
                <br><br>

                <p>Gender:</p>
                <input type="radio" id="male" name="gender" value="Male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>

            </fieldset>

            <br>

            <fieldset>
                <legend>Academic Details</legend>

                <label for="course">Select Course:</label>
                <select id="course" name="course" required>
                    <option value="">Choose Course</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>BBA</option>
                </select>
                <br><br>

                <label for="qualification">Previous Qualification:</label>
                <input type="text" id="qualification"
                       name="qualification" required>
                <br><br>

                <label for="marks">Percentage:</label>
                <input type="number" id="marks" name="marks"
                       min="0" max="100" required>

            </fieldset>

            <br>

            <fieldset>
                <legend>Other Details</legend>

                <label for="address">Address:</label>
                <br>
                <textarea id="address" name="address"
                          rows="4" cols="30" required></textarea>
                <br><br>

                <label for="photo">Upload Photograph:</label>
                <input type="file" id="photo" name="photo"
                       accept="image/*">
            </fieldset>

            <br>

            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">I agree to the terms and conditions.</label>

            <br><br>

            <button type="submit">Submit Application</button>
            <button type="reset">Reset Form</button>

        </form>

    </main>

    <footer>
        <p>Student Admission Portal</p>
    </footer>

</body>
</html>
